name: Update recent activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the activity section from public events
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;
            const { data: events } = await github.rest.activity.listPublicEventsForUser({ username: user, per_page: 100 });

            const repo = (e) => `[${e.repo.name}](https://github.com/${e.repo.name})`;
            // Event payloads are trimmed: PRs carry a number but no html_url,
            // pushes carry no commit count. Links are built from the repo name.
            const prLink = (e, n) => `[#${n}](https://github.com/${e.repo.name}/pull/${n})`;
            const issueLink = (e, n) => `[#${n}](https://github.com/${e.repo.name}/issues/${n})`;

            // Pushes to someone else's fork (a PR branch) read oddly on a profile,
            // so a push only counts in a repo that is not a fork.
            const forkCache = new Map();
            const isFork = async (name) => {
              if (!forkCache.has(name)) {
                const [owner, repoName] = name.split('/');
                forkCache.set(name, await github.rest.repos.get({ owner, repo: repoName })
                  .then((r) => r.data.fork, () => true));
              }
              return forkCache.get(name);
            };

            const lines = [];
            for (const e of events) {
              if (e.repo.name === `${user}/${user}`) continue;
              const p = e.payload;
              const n = p.number ?? p.pull_request?.number;
              let line = null;
              if (e.type === 'PullRequestEvent' && (p.action === 'merged' || (p.action === 'closed' && p.pull_request?.merged))) {
                line = `🎉 Merged PR ${prLink(e, n)} in ${repo(e)}`;
              } else if (e.type === 'PullRequestEvent' && p.action === 'opened') {
                line = `💪 Opened PR ${prLink(e, n)} in ${repo(e)}`;
              } else if (e.type === 'PullRequestReviewEvent') {
                line = `👀 Reviewed PR ${prLink(e, n)} in ${repo(e)}`;
              } else if (e.type === 'IssuesEvent' && p.action === 'opened' && lines.filter((l) => l.startsWith('❗')).length < 2) {
                line = `❗ Opened issue ${issueLink(e, p.issue.number)} in ${repo(e)}`;
              } else if (e.type === 'ReleaseEvent' && p.action === 'published') {
                line = `🚀 Released [${p.release.tag_name}](https://github.com/${e.repo.name}/releases/tag/${p.release.tag_name}) of ${repo(e)}`;
              } else if (e.type === 'PushEvent') {
                // One push line per repo, so a busy day in one repo does not fill the list.
                const seen = lines.some((l) => l.startsWith('⬆️') && l.endsWith(repo(e)));
                if (!seen && !(await isFork(e.repo.name))) line = `⬆️ Pushed to ${repo(e)}`;
              } else if (e.type === 'CreateEvent' && p.ref_type === 'repository') {
                line = `✨ Created ${repo(e)}`;
              }
              if (line && !lines.includes(line)) lines.push(line);
              if (lines.length === 8) break;
            }

            const body = lines.length
              ? lines.map((l, i) => `${i + 1}. ${l}`).join('\n')
              : '_No recent public activity._';
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!--START_SECTION:activity-->[\s\S]*<!--END_SECTION:activity-->/,
              `<!--START_SECTION:activity-->\n${body}\n<!--END_SECTION:activity-->`,
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update recent activity"
          git push
